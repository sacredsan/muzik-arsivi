# İzleme: her sabah 09:17'de (İstanbul) Telegram'a günlük özet, 4 saatte bir sorun varsa alarm.
# Gerekli GitHub Secrets: SUPABASE_URL, SUPABASE_SERVICE_KEY, TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID
# Elle deneme: GitHub > Actions > izleme > Run workflow
name: izleme

on:
  schedule:
    - cron: "17 6 * * *"     # 06:17 UTC = 09:17 İstanbul -> günlük özet
    - cron: "47 */4 * * *"   # 4 saatte bir -> sadece sorun varsa alarm
  workflow_dispatch:
    inputs:
      report:
        description: "Günlük özeti şimdi gönder"
        type: boolean
        default: true

jobs:
  notify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PYTHONUTF8: "1"
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -q -r requirements.txt
      - name: Bildirim
        run: |
          if [ "${{ github.event.schedule }}" = "17 6 * * *" ] || [ "${{ inputs.report }}" = "true" ]; then
            python -m muzikarsiv notify --report
          else
            python -m muzikarsiv notify
          fi
